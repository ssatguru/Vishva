<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />

    <meta name="Vishva" content="" />
    <meta name="Satguru Srivastava" content="" />
    <!-- <link rel="icon" href="../../favicon.ico" /> -->
     <link rel="shortcut icon" href="data:image/x-icon;" type="image/x-icon"> 
    <base href="../" />

    <title>Vishva</title>
  </head>

  <body oncontextmenu="return false;" style="background-color: #000000; color: #ffffff">
    <div id="vGUI" style="position: absolute; left: 0px; top: 0px; width: 100%; height: 100%">
      <div id="modalOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); z-index: 999; pointer-events: auto;"></div>
      <div id="loadingMsg" style="text-align: center; width: 300px; height: auto; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: rgba(0, 0, 0, 0.8); padding: 20px; border-radius: 10px; z-index: 1000; max-height: 80vh; overflow-y: auto;">
        <div id="loadingText" style="font-size: 18px; margin-bottom: 10px;">Loading</div>
        <div id="loadingStatus" style="font-size: 14px; margin-bottom: 15px; color: #aaa;">Please wait...</div>
        <div style="width: 100%; background-color: #333; border-radius: 5px; overflow: hidden;">
          <div id="loadingProgress" style="width: 0%; height: 20px; background: linear-gradient(90deg, #4CAF50, #8BC34A); transition: width 0.3s ease;"></div>
        </div>
        <div id="loadingPercent" style="font-size: 12px; margin-top: 10px; color: #888; width:0%">0%</div>
        <button id="closeButton" style="display: none; margin-top: 16px; padding: 8px 16px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; transition: background-color 0.3s;">Close</button>
      </div>
    </div>
    <canvas id="vCanvas" tabindex="1" touch-action="none" style="position: absolute; top: 0%; bottom: 0%; width: 100%; height: 100%"> </canvas>
  </body>

  <!-- <script type="text/javascript" src="https://cdn.babylonjs.com/Oimo.js"></script> -->

  <script type="text/javascript" src="bin/assets/internalAssets.js"></script>
  <script type="text/javascript" src="bin/main.js"></script>
</html>
